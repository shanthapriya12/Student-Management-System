{% extends "base.html" %}

{% block content %}

<h1>Add Student</h1>

<form method="POST">

    <label>Roll Number</label>
    <input
        type="number"
        name="roll"
        required
    >

    <label>Name</label>
    <input
        type="text"
        name="name"
        required
    >

    <label>Age</label>
    <input
        type="number"
        name="age"
        required
    >

    <label>Department</label>
    <input
        type="text"
        name="department"
        required
    >

    <label>Email</label>
    <input
        type="email"
        name="email"
        required
    >

    <label>Phone</label>
    <input
        type="text"
        name="phone"
        required
    >

    <button type="submit">
        Add Student
    </button>

</form>

{% endblock %}
